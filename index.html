<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת שמי׳ז 💰</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --hilel: #FF6B9D;
  --mitar: #9B59B6;
  --yagel: #00B4D8;
  --gold: #F4C430;
  --shami: #2ECC71;
  --bg: #F7F3ED;
  --card: #FFFFFF;
  --card2: #F0EBE3;
  --text: #2C1810;
  --text2: #7A6A5A;
  --border: #E8DDD0;
  --mandatory: #E8F4FD;
  --mandatory-border: #AED6F1;
  --bonus: #FEF9E7;
  --bonus-border: #F9E79F;
  --danger: #E74C3C;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.app-header {
  background: var(--text);
  color: #FFF;
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
}
.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-display {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.5);
  text-align: left;
}

/* TABS */
.tabs {
  display: flex;
  background: rgba(0,0,0,0.2);
}
.tab {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
}
.tab:hover { color: rgba(255,255,255,0.8); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(255,255,255,0.05); }

/* CONTAINER */
.container { max-width: 700px; margin: 0 auto; padding: 16px; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* KID SELECTOR */
.kid-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: var(--card);
  border-radius: 14px;
  padding: 6px;
  box-shadow: var(--shadow);
}
.kid-btn {
  flex: 1;
  padding: 10px 8px;
  border: 2px solid transparent;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  font-family: 'Heebo', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text2);
  transition: all 0.2s;
  text-align: center;
}
.kid-btn .kid-emoji { font-size: 1.4rem; display: block; margin-bottom: 2px; }
.kid-btn .kid-bal { font-family: 'Fredoka One', cursive; font-size: 0.8rem; display: block; }
.kid-btn.active { background: var(--kid-color); color: white; border-color: var(--kid-color); }
.kid-btn:not(.active):hover { background: var(--card2); }

/* WALLET CARD */
.wallet-card {
  background: var(--text);
  border-radius: 20px;
  padding: 20px 24px;
  margin-bottom: 16px;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.wallet-card::before {
  content: '💰';
  position: absolute;
  font-size: 8rem;
  right: -20px;
  top: -20px;
  opacity: 0.06;
}
.wallet-name { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
.wallet-balance { font-family: 'Fredoka One', cursive; font-size: 2.8rem; color: var(--gold); line-height: 1; }
.wallet-unit { font-size: 0.9rem; color: rgba(255,255,255,0.5); }
.wallet-stats { display: flex; gap: 20px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
.w-stat { }
.w-stat-val { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--shami); }
.w-stat-lbl { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
.nis-rate { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 12px; display: inline-block; }

/* SECTION HEADER */
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  margin-top: 20px;
}
.section-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 50px;
  letter-spacing: 0.5px;
}
.badge-bonus { background: var(--bonus); color: #D4AC0D; border: 1px solid var(--bonus-border); }
.section-title-text { font-family: 'Fredoka One', cursive; font-size: 1.1rem; }

/* TASK LIST */
.task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

.task-item {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  transition: all 0.15s;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.task-item:active { transform: scale(0.98); }
.task-item.bonus-item { border-right: 4px solid #F9E79F; }
.task-item.done { opacity: 0.55; }
.task-item.done .task-name { text-decoration: line-through; }

.task-check {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid #DDD;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 0.9rem;
  transition: all 0.2s;
  background: white;
}
.task-item.done .task-check { background: #2ECC71; border-color: #2ECC71; color: white; }
.task-item.bonus-item .task-check { border-color: #F9E79F; }

.task-icon { font-size: 1.4rem; flex-shrink: 0; }
.task-info { flex: 1; }
.task-name { font-weight: 700; font-size: 0.9rem; line-height: 1.3; }
.task-sub { font-size: 0.72rem; color: var(--text2); margin-top: 1px; }

.task-reward {
  font-family: 'Fredoka One', cursive;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 50px;
  white-space: nowrap;
  flex-shrink: 0;
}
.reward-bonus { background: #FDEBD0; color: #D35400; }
.settings-title { font-family: 'Fredoka One', cursive; font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.setting-row {
  background: var(--card);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}
.sr-icon { font-size: 1.2rem; flex-shrink: 0; }
.sr-info { flex: 1; }
.sr-name { font-weight: 700; font-size: 0.88rem; }
.sr-sub { font-size: 0.72rem; color: var(--text2); margin-top: 1px; }
.sr-val {
  background: var(--card2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 5px 8px;
  font-family: 'Fredoka One', cursive;
  font-size: 0.95rem;
  color: var(--text);
  width: 70px;
  text-align: center;
  outline: none;
}
.sr-val:focus { border-color: var(--gold); }

/* HISTORY */
.history-item {
  background: var(--card);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}
.hi-icon { font-size: 1.2rem; }
.hi-info { flex: 1; }
.hi-name { font-weight: 700; font-size: 0.85rem; }
.hi-meta { font-size: 0.72rem; color: var(--text2); margin-top: 1px; }
.hi-amount { font-family: 'Fredoka One', cursive; color: #27AE60; font-size: 0.95rem; }

/* CELEBRATION */
.celebration {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.celebration.show { opacity: 1; pointer-events: all; }
.cel-box {
  background: var(--card);
  border-radius: 24px;
  padding: 36px 28px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
@keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.cel-emoji { font-size: 4rem; display: block; animation: bounce 0.6s ease infinite alternate; margin-bottom: 10px; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
.cel-title { font-family: 'Fredoka One', cursive; font-size: 1.6rem; margin-bottom: 6px; }
.cel-sub { font-size: 0.9rem; color: var(--text2); margin-bottom: 6px; }
.cel-amount { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #D35400; margin-bottom: 20px; }
.cel-btn {
  background: var(--text);
  color: var(--gold);
  border: none; border-radius: 50px;
  padding: 12px 32px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  cursor: pointer;
}

/* CONFETTI */
.confetti-piece {
  position: fixed; width: 9px; height: 9px;
  animation: confetti-fall 2.2s ease forwards;
  z-index: 300; pointer-events: none;
  border-radius: 2px;
}
@keyframes confetti-fall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* RESET BTN */
.reset-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px 16px;
  font-family: 'Heebo', sans-serif;
  font-size: 0.8rem;
  color: var(--text2);
  cursor: pointer;
  margin-top: 8px;
  width: 100%;
  transition: all 0.2s;
}
.reset-btn:hover { background: #FDE8E8; border-color: var(--danger); color: var(--danger); }
.f-input {
  flex: 1; min-width: 130px;
  background: var(--card2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  font-family: 'Heebo', sans-serif;
  font-size: 0.85rem;
  color: var(--text);
  outline: none;
}
.f-input:focus { border-color: var(--gold); }
.f-input::placeholder { color: var(--text2); }
select.f-input option { background: white; }
.btn-add {
  background: var(--text);
  color: var(--gold);
  border: none;
  border-radius: 10px;
  padding: 9px 20px;
  font-family: 'Fredoka One', cursive;
  font-size: 0.95rem;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.btn-add:hover { opacity: 0.85; }

/* SHOP */
.shop-cat-header {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0 10px;
}
.shop-cat-emoji { font-size: 1.4rem; }
.shop-cat-label { font-family: 'Fredoka One', cursive; font-size: 1.1rem; }

.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 4px;
}

.shop-card {
  background: var(--card);
  border-radius: 18px;
  padding: 18px 14px;
  text-align: center;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  box-shadow: var(--shadow);
}
.shop-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-color: var(--gold); }
.shop-card:active { transform: scale(0.97); }
.shop-card.affordable { border-color: #F4C430; }
.shop-card.unaffordable { opacity: 0.5; cursor: not-allowed; }

.shop-item-icon { font-size: 2.4rem; display: block; margin-bottom: 8px; }
.shop-item-name { font-weight: 700; font-size: 0.85rem; line-height: 1.3; margin-bottom: 6px; }
.shop-item-desc { font-size: 0.72rem; color: var(--text2); margin-bottom: 10px; line-height: 1.4; }
.shop-item-cost {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--text);
  color: var(--gold);
  font-family: 'Fredoka One', cursive;
  font-size: 0.9rem;
  border-radius: 50px;
  padding: 4px 12px;
}
.shop-balance-bar {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}
.sbb-name { font-weight: 700; font-size: 0.9rem; }
.sbb-balance { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: #D35400; }
.sbb-label { font-size: 0.72rem; color: var(--text2); }

/* CONFIRM MODAL */
.confirm-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.confirm-modal.show { opacity: 1; pointer-events: all; }
.confirm-box {
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 28px 24px 36px;
  width: 100%; max-width: 500px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.confirm-icon { font-size: 3rem; text-align: center; display: block; margin-bottom: 10px; }
.confirm-title { font-family: 'Fredoka One', cursive; font-size: 1.3rem; text-align: center; margin-bottom: 6px; }
.confirm-desc { font-size: 0.85rem; color: var(--text2); text-align: center; margin-bottom: 6px; }
.confirm-cost { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #D35400; text-align: center; margin-bottom: 20px; }
.confirm-btns { display: flex; gap: 10px; }
.btn-confirm {
  flex: 1; background: var(--text); color: var(--gold);
  border: none; border-radius: 12px; padding: 13px;
  font-family: 'Fredoka One', cursive; font-size: 1rem;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-confirm:hover { opacity: 0.85; }
.btn-cancel {
  flex: 1; background: var(--card2); color: var(--text2);
  border: 1.5px solid var(--border); border-radius: 12px; padding: 13px;
  font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 0.9rem;
  cursor: pointer;
}

@media (max-width: 400px) {
  .shop-grid { grid-template-columns: repeat(2, 1fr); }
}

/* STREAK CARDS */
.streak-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.streak-card {
  border-radius: 14px;
  padding: 10px 8px;
  text-align: center;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s;
  box-shadow: var(--shadow);
}
.streak-card:active { transform: scale(0.97); }
.streak-card.cold { background: var(--card); border: 1.5px solid var(--border); }
.streak-card.warm { background: #FFF5E6; border: 2px solid #FF9A3C; }
.streak-card.hot { background: linear-gradient(135deg, #FFF3CD, #FFE066); border: 2px solid #F4C430; animation: streak-pulse 1.5s ease infinite; }

@keyframes streak-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(244,196,48,0.4); }
  50%      { box-shadow: 0 0 0 8px rgba(244,196,48,0); }
}

.streak-emoji { font-size: 1.3rem; display: block; margin-bottom: 2px; }
.streak-name { font-family: 'Fredoka One', cursive; font-size: 0.88rem; margin-bottom: 4px; }
.streak-dots { display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; }
.streak-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #DDD; background: white; transition: all 0.3s; }
.streak-dot.filled.cold { background: #BDC3C7; border-color: #95A5A6; }
.streak-dot.filled.warm { background: #FF9A3C; border-color: #E67E22; }
.streak-dot.filled.hot { background: #F4C430; border-color: #D4A017; box-shadow: 0 0 6px rgba(244,196,48,0.6); }
.streak-count { font-family: 'Fredoka One', cursive; font-size: 1.3rem; line-height: 1; }
.streak-label { font-size: 0.65rem; color: var(--text2); margin-bottom: 6px; }
.streak-msg { font-size: 0.68rem; font-weight: 700; border-radius: 50px; padding: 3px 10px; display: inline-block; }
.streak-msg.cold { background: #F0F0F0; color: #888; }
.streak-msg.warm { background: #FFE0B2; color: #E65100; }
.streak-msg.hot { background: #F4C430; color: #5D4037; }

/* STREAK POPUP */
.streak-popup {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 180;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.streak-popup.show { opacity: 1; pointer-events: all; }
.streak-popup-box {
  background: var(--card);
  border-radius: 24px;
  padding: 28px 24px;
  max-width: 320px; width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.sp-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
.sp-title { font-family: 'Fredoka One', cursive; font-size: 1.4rem; margin-bottom: 6px; }
.sp-sub { font-size: 0.85rem; color: var(--text2); margin-bottom: 14px; }
.sp-record { background: var(--card2); border-radius: 12px; padding: 10px; margin-bottom: 14px; }
.sp-record-val { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: #D35400; }
.sp-record-lbl { font-size: 0.72rem; color: var(--text2); }
.sp-close { background: var(--text); color: var(--gold); border: none; border-radius: 50px; padding: 10px 28px; font-family: 'Fredoka One', cursive; font-size: 0.95rem; cursor: pointer; }

@media (max-width:480px) {
  .streak-card { padding: 10px 8px; }
  .streak-count { font-size: 1.3rem; }
  .streak-dot { width: 11px; height: 11px; }
}

.empty { text-align: center; padding: 30px; color: var(--text2); font-size: 0.9rem; }
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; }
/* TODAY HEADER */
.today-hero {
  background: var(--text);
  border-radius: 20px;
  padding: 12px 16px;
  margin-bottom: 10px;
  margin-top: 4px;
  color: white;
  position: relative;
  overflow: hidden;
}
.today-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(244,196,48,0.15), rgba(46,204,113,0.1));
  pointer-events: none;
}
.today-greeting { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: var(--gold); margin-bottom: 2px; }
.today-datetime { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-bottom: 12px; }
.today-quote {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.75);
  font-style: italic;
  line-height: 1.5;
  border-right: 3px solid var(--gold);
  padding-right: 10px;
}
.today-quote-attr { font-size: 0.7rem; color: rgba(255,255,255,0.35); margin-top: 4px; }

/* ALL KIDS GRID */
.all-kids-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.kid-column {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}
.kid-col-header {
  padding: 10px 10px 8px;
  text-align: center;
  border-bottom: 2px solid var(--border);
  position: relative;
}
.kid-col-emoji { font-size: 1.6rem; display: block; }
.kid-col-name { font-family: 'Fredoka One', cursive; font-size: 1rem; }
.kid-col-balance { font-size: 0.7rem; color: var(--text2); margin-top: 1px; }
.kid-col-bonus-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 50px;
  margin-top: 4px;
  display: inline-block;
}

.kid-col-body { padding: 8px 6px; }

.mini-group-label {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 8px 0 4px 0;
  padding-right: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.mini-group-done { color: #27AE60; }

.mini-task {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 6px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 3px;
  border: 1px solid transparent;

// ---------- merge ----------
function isAdditivePath(p) {
  return /^kids\.[^.]+\.(balance|totalEarned)$/.test(p) || /^familyChallengeCount\.[^.]+$/.test(p);
}

function merge3(b, l, r, path) {
  path = path || '';
  if (eq(l, r)) return clone(l);
  if (eq(b, l)) return clone(r);      // רק השרת השתנה
  if (eq(b, r)) return clone(l);      // רק המכשיר השתנה
  // שני הצדדים שינו
  if (typeof l === 'number' && typeof r === 'number' && typeof b === 'number' && isAdditivePath(path)) {
    return b + (l - b) + (r - b);
  }
  if (isPlainObj(l) && isPlainObj(r)) {
    const bo = isPlainObj(b) ? b : {};
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    const out = {};
    const keys = new Set(Object.keys(r).concat(Object.keys(l)));
    keys.forEach(k => {
      const inL = has(l, k), inR = has(r, k), inB = has(bo, k);
      const p = path ? path + '.' + k : k;
      if (inL && inR) { out[k] = merge3(inB ? bo[k] : undefined, l[k], r[k], p); return; }
      if (inL) { if (inB && eq(bo[k], l[k])) return; out[k] = clone(l[k]); return; }   // נמחק בשרת
      if (inR) { if (inB && eq(bo[k], r[k])) return; out[k] = clone(r[k]); }           // נמחק במכשיר
    });
    return out;
  }
  if (Array.isArray(l) && Array.isArray(r)) return mergeArr(Array.isArray(b) ? b : [], l, r, path);
  return clone(l);
}

function mergeArr(b, l, r, path) {
  const all = b.concat(l, r);
  if (all.every(x => x === null || typeof x !== 'object')) {
    const B = new Set(b.map(canon)), L = new Set(l.map(canon)), R = new Set(r.map(canon));
    const out = r.filter(x => !(B.has(canon(x)) && !L.has(canon(x))));
    l.forEach(x => { const k = canon(x); if (!R.has(k) && !B.has(k)) out.push(x); });
    return clone(out);
  }
  const key = path === 'actionLog'
    ? (x => (x && x.ts) ? [x.ts, x.kidId, x.amount, x.action].join('|') : canon(x))
    : (x => (x && x.id !== undefined) ? 'id:' + x.id : canon(x));
  const bm = new Map(b.map(x => [key(x), x]));
  const lm = new Map(l.map(x => [key(x), x]));
  const rm = new Map(r.map(x => [key(x), x]));
  const out = [];
  r.forEach(x => {
    const k = key(x);
    if (lm.has(k)) out.push(merge3(bm.get(k), lm.get(k), x, path + '[]'));
    else if (bm.has(k)) { if (!eq(bm.get(k), x)) out.push(clone(x)); }
    else out.push(clone(x));
  });
  l.forEach(x => {
    const k = key(x);
    if (rm.has(k)) return;
    if (bm.has(k)) { if (!eq(bm.get(k), x)) out.push(clone(x)); }
    else out.push(clone(x));
  });
  if (path === 'actionLog') out.sort((a, c) => (a.ts || 0) - (c.ts || 0));
  return out;
}

  const lLog = L.actionLog || [], rLog = R.actionLog || [];
  const maxTs = log => log.reduce((m, x) => Math.max(m, (x && x.ts) || 0), 0);
  // הגדרות ומשימות: לוקחים מהצד שהיה פעיל אחרון; מהצד השני מוסיפים רק סימונים
  const primary = maxTs(lLog) > maxTs(rLog) ? L : R;
  const secondary = primary === L ? R : L;
  const merged = clone(primary);
  ['taskChecks', 'bonusChecks', 'weeklyChecks', 'groupBonusGiven', 'dayComplete', 'streakBonusGiven'].forEach(m => {
    const src = secondary[m] || {};
    merged[m] = merged[m] || {};
    Object.keys(src).forEach(d => {
      if (!isPlainObj(src[d])) { if (merged[m][d] === undefined) merged[m][d] = clone(src[d]); return; }
      merged[m][d] = merged[m][d] || {};
      Object.keys(src[d]).forEach(k => {
        if (isPlainObj(src[d][k])) merged[m][d][k] = Object.assign({}, src[d][k], merged[m][d][k] || {});
        else if (merged[m][d][k] === undefined) merged[m][d][k] = clone(src[d][k]);
      });
    });
  });
  const ids = new Set((merged.parentMessages || []).map(x => x.id));
  (secondary.parentMessages || []).forEach(x => { if (!ids.has(x.id)) merged.parentMessages.push(clone(x)); });

  // כסף: היתרה בענן + תנועות שקיימות רק במכשיר
  const rKeys = new Set(rLog.map(logKey));
  const floor = rLog.length ? Math.max(Math.min.apply(null, rLog.map(x => x.ts || Infinity)), R.archivedThrough || 0) : Infinity;
  const extra = {}, uniq = [];
  lLog.forEach(x => {
    if (!x || !x.ts || x.ts <= floor || rKeys.has(logKey(x))) return;
    uniq.push(clone(x));
    const e = extra[x.kidId] = extra[x.kidId] || { bal: 0, earned: 0 };
    e.bal += Number(x.amount) || 0;
    if (x.amount > 0) e.earned += x.amount;
  });
  merged.actionLog = rLog.map(clone).concat(uniq).sort((a, c) => (a.ts || 0) - (c.ts || 0));
  merged.archivedThrough = R.archivedThrough || merged.archivedThrough || 0;
  merged.kids = merged.kids || {};
  Object.keys(Object.assign({}, R.kids, L.kids)).forEach(k => {
    const rk = (R.kids && R.kids[k]) || { balance: 0, totalEarned: 0 };
    const e = extra[k] || { bal: 0, earned: 0 };
    merged.kids[k] = { balance: (rk.balance || 0) + e.bal, totalEarned: (rk.totalEarned || 0) + e.earned };
  });
  if (merged.parentPinHash === undefined && secondary.parentPinHash) merged.parentPinHash = secondary.parentPinHash;
  return merged;
}

// ---------- save / push / pull ----------
function saveState() {
  pruneState(state);
  lsSet(LS_STATE, JSON.stringify(state));
  if (!SCRIPT_URL) return;
  lsSet(LS_DIRTY, '1');
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(pushNow, 1500);
}

function isDirty() { return lsGet(LS_DIRTY) === '1'; }
function getBase() { const s = lsGet(LS_BASE); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } }
function setBase(s, rev) {
  lsSet(LS_BASE, JSON.stringify(s));
  if (rev !== undefined && rev !== null) lsSet(LS_REV, String(rev));
}

async function fetchJSON(url, opts, ms) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms || 15000) : null;
  try {
    const r = await fetch(url, Object.assign({}, opts || {}, ctl ? { signal: ctl.signal } : {}));
    return await r.json();
  } finally {
    if (t) clearTimeout(t);
  }
}

// השרת מעביר פעולות ישנות לארכיון — מחילים את אותו קיצוץ אצלנו
function applyServerPrune(s, d) {
  if (d.legacyArchived && Array.isArray(s.history) && s.history.length) s.history = [];
  if (typeof d.archivedThrough === 'number') {
    s.archivedThrough = d.archivedThrough;
    if (Array.isArray(s.actionLog)) s.actionLog = s.actionLog.filter(x => !(x && x.ts && x.ts <= d.archivedThrough));
  }
}

async function pushNow() {
  if (!SCRIPT_URL) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  if (!isDirty()) return;
  SYNC.busy = true;
  clearTimeout(SYNC.retryTimer);
  _showSyncIndicator('שומר...');
  let ok = false;
  try {
    for (let attempt = 0; attempt < 4 && !ok; attempt++) {
      const revStr = lsGet(LS_REV);
      const baseRev = revStr === null ? -1 : Number(revStr);
      const snapshot = clone(state);
      const sent = canon(snapshot);
      const d = await fetchJSON(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({}, snapshot, { _baseRev: baseRev })),
      }, 25000);
      if (d && d.ok) {
        const changedMeanwhile = canon(state) !== sent;
        applyServerPrune(snapshot, d);
        applyServerPrune(state, d);
        setBase(snapshot, d.rev);
        lsSet(LS_STATE, JSON.stringify(state));
        if (!changedMeanwhile) lsDel(LS_DIRTY);
        ok = true;
      } else if (d && d.conflict) {
        const remote = stripMeta(d.state);
        const base = getBase();
        state = normalizeState(base ? merge3(base, state, remote) : firstSyncMerge(state, normalizeState(clone(remote))));
        setBase(remote, d.rev);
        lsSet(LS_STATE, JSON.stringify(state));
        refreshUI();
      } else {
        throw new Error((d && d.error) || 'save failed');
      }
    }
    if (!ok) throw new Error('too many conflicts');
    _showSyncIndicator('✓ סונכרן', 2000);
  } catch (e) {
    _showSyncIndicator('⚠️ לא נשמר בענן — ננסה שוב', 4000);
    SYNC.retryTimer = setTimeout(pushNow, 30000);
  } finally {
    SYNC.busy = false;
    if (SYNC.again || (ok && isDirty())) {
      SYNC.again = false;
      clearTimeout(SYNC.timer);
      SYNC.timer = setTimeout(pushNow, 800);
    }
  }
}

async function pullNow(force) {
  if (!SCRIPT_URL || SYNC.busy) return;
  SYNC.busy = true;
  let changed = false;
  try {
    const haveRev = lsGet(LS_REV);
    if (!force && haveRev !== null) {
      const c = await fetchJSON(SCRIPT_URL + '?check=1', {}, 10000);
      if (c && typeof c.rev === 'number' && c.rev === Number(haveRev)) return;
    }
    if (force) _showSyncIndicator('טוען...');
    const raw = await fetchJSON(SCRIPT_URL, {}, 20000);
    if (!raw || raw.error) throw new Error((raw && raw.error) || 'load failed');
    const rev = typeof raw._rev === 'number' ? raw._rev : 0;
    if (!raw.kids) {                       // הענן ריק — מעלים את מה שיש במכשיר
      setBase({}, rev);
      lsSet(LS_DIRTY, '1');
      _showSyncIndicator('', 0);
      return;
    }
    const remote = stripMeta(raw);
    const base = getBase();
    if (!base && SYNC.firstRun) state = normalizeState(firstSyncMerge(state, normalizeState(clone(remote))));
    else if (isDirty()) state = normalizeState(base ? merge3(base, state, remote) : firstSyncMerge(state, normalizeState(clone(remote))));
    else state = normalizeState(clone(remote));
    SYNC.firstRun = false;
    setBase(remote, rev);
    pruneState(state);
    lsSet(LS_STATE, JSON.stringify(state));
    if (!eq(state, remote)) lsSet(LS_DIRTY, '1'); else lsDel(LS_DIRTY);
    changed = true;
    _showSyncIndicator(force ? '✓ נטען' : '', force ? 1500 : 0);
  } catch (e) {
    _showSyncIndicator(force ? '⚠️ אין חיבור — עובד מקומית' : '', force ? 3000 : 0);
  } finally {
    SYNC.busy = false;
    if (changed) refreshUI();
    if (isDirty() || SYNC.again) {
      SYNC.again = false;
      clearTimeout(SYNC.timer);
      SYNC.timer = setTimeout(pushNow, 500);
    }
  }
}

function refreshUI() {
  const ae = document.activeElement;
  if (ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)) { SYNC.pendingRender = true; return; }
  SYNC.pendingRender = false;
  renderAll();
}

function _showSyncIndicator(msg, hideAfter) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  clearTimeout(el._t);
  if (!msg) { el.style.opacity = '0'; return; }
  el.textContent = msg;
  el.style.opacity = '1';
  if (hideAfter) el._t = setTimeout(() => { el.style.opacity = '0'; }, hideAfter);
}

// ============================================================
// STATE
// ============================================================
function loadState() {
  try {
    const s = lsGet(LS_STATE);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return null;
}

function defaultQuotes() {
  return DEFAULT_QUOTES.map((q, i) => ({ id: 'dq' + i, text: q.text, author: q.author }));
}

function defaultState() {
  const s = {
    schema: 3,
    family: Object.assign({}, DEFAULT_FAMILY),
    kidProfiles: {},
    kids: {},
    dayTasks: legacyDayTasks({}),                 // כל משימות "היום" — חובה ובונוס
    bonusTasks: DEFAULT_BONUS_TASKS.map(t => ({ ...t, reward: t.defaultReward })),   // טאב "בונוס"
    removedBonusTasks: [],
    weeklyGeneralTasks: DEFAULT_WEEKLY_GENERAL.map(t => ({ ...t, days: ['weekdays'], kidId: 'all' })),
    weeklyAssign: {},     // שיוך משימות טאב "בונוס" לילד מסוים
    shop: legacyShop({}),
    quotes: defaultQuotes(),
    history: [],          // גרסה 1 בלבד — ההיסטוריה נגזרת היום מ-actionLog
    customQuotes: [],     // גרסה 1-2 בלבד
    actionLog: [],
    archivedThrough: 0,
    customTasks: [],      // גרסה 1-2 בלבד
    streaks: {},          // גרסה 1 בלבד
    dayComplete: {},      // { date: { kidId: true } } — ימים שהושלמו במלואם
    streakBest: {},
    streakBonusGiven: {},
    parentMessages: [],
    oneTimeTasks: [],
    familyChallenge: { goal: 30, reward: 'יציאה לפיצה 🍕', active: true },
    familyChallengeCount: {},
    taskChecks: {},
    bonusChecks: {},
    weeklyChecks: {},
    groupBonusGiven: {},
    customShop: { categories: [], removedBuiltins: [], removedItems: [] },   // גרסה 1-2 בלבד
    customMandatory: { overrides: {}, hidden: [], customTasks: [] },        // גרסה 1-2 בלבד
    settings: { groupBonus: {}, streakTarget: 7, streakBonus: 50 },
  };
  GROUPS.forEach(g => { s.settings.groupBonus[g.id] = g.bonus; });
  Object.keys(DEFAULT_KIDS).forEach((k, i) => {
    s.kidProfiles[k] = Object.assign({ order: i, hidden: false }, DEFAULT_KIDS[k]);
    s.kids[k] = { balance: 0, totalEarned: 0 };
  });
  return s;
}

// מוסיף שדות חסרים, ממיר נתונים מגרסאות קודמות, ומקצץ נתונים ישנים.
// לא דורס עריכות של ההורה.
function normalizeState(s) {
  if (!s || typeof s !== 'object' || !s.kids) s = defaultState();
  const fromSchema = s.schema || 1;
  const d = defaultState();
  Object.keys(d).forEach(k => { if (s[k] === undefined || s[k] === null) s[k] = d[k]; });
  if (!s.family.name) s.family.name = DEFAULT_FAMILY.name;
  if (!s.family.currency) s.family.currency = DEFAULT_FAMILY.currency;
  Object.keys(s.kidProfiles).forEach((k, i) => {
    const p = s.kidProfiles[k];
    if (!p.name) p.name = k;
    if (!p.emoji) p.emoji = '🙂';
    if (!p.color) p.color = '#7F8C8D';
    if (typeof p.order !== 'number') p.order = i;
    if (!s.kids[k]) s.kids[k] = { balance: 0, totalEarned: 0 };
    if (typeof s.kids[k].balance !== 'number') s.kids[k].balance = Number(s.kids[k].balance) || 0;
    if (typeof s.kids[k].totalEarned !== 'number') s.kids[k].totalEarned = Number(s.kids[k].totalEarned) || 0;
  });
  if (!s.settings.groupBonus) s.settings.groupBonus = {};
  GROUPS.forEach(g => { if (typeof s.settings.groupBonus[g.id] !== 'number') s.settings.groupBonus[g.id] = g.bonus; });
  if (typeof s.settings.streakTarget !== 'number') s.settings.streakTarget = 7;
  if (typeof s.settings.streakBonus !== 'number') s.settings.streakBonus = 50;

  // מזהים קבועים לפריטים בלי id (נדרש למיזוג)
  s.parentMessages.forEach(m => { if (!m.id) m.id = 'pm' + hashStr((m.date || '') + '|' + (m.time || '') + '|' + (m.text || '')); });
  (s.customQuotes || []).forEach(q => { if (!q.id) q.id = 'q' + hashStr((q.text || '') + '|' + (q.author || '')); });
  if (!Array.isArray(s.history)) s.history = [];

  // גרסה 1 → 2: רצף נשמר כרשימת ימים שהושלמו
  if (fromSchema < 2) {
    const tKey = todayKey(), yKey = dateKey(daysAgo(1));
    Object.keys(s.streaks || {}).forEach(kid => {
      const st = s.streaks[kid] || {};
      if (st.best) s.streakBest[kid] = Math.max(s.streakBest[kid] || 0, st.best);
      if (st.count > 0 && (st.lastDate === tKey || st.lastDate === yKey)) {
        const last = new Date(st.lastDate + 'T12:00:00');
        for (let i = 0; i < st.count && i < 400; i++) {
          const dd = new Date(last); dd.setDate(dd.getDate() - i);
          const k = dateKey(dd);
          (s.dayComplete[k] = s.dayComplete[k] || {})[kid] = true;
        }
      }
    });
  }

  // גרסה 2 → 3: כל הפריטים הניתנים לעריכה עוברים לרשימות אחידות
  if (fromSchema < 3) {
    if (s.nisRate === undefined && s.settings.nisRate) s.nisRate = s.settings.nisRate;
    s.dayTasks = legacyDayTasks(s);
    s.shop = legacyShop(s);
    s.quotes = defaultQuotes().concat((s.customQuotes || []).map(q => ({ id: q.id, text: q.text, author: q.author })));
    const removed = s.removedBonusTasks || [];
    DEFAULT_BONUS_TASKS.forEach(dt => {
      if (!removed.includes(dt.id) && !s.bonusTasks.find(t => t.id === dt.id)) s.bonusTasks.push({ ...dt, reward: dt.defaultReward });
    });
    DEFAULT_WEEKLY_GENERAL.forEach(dt => {
      if (!s.weeklyGeneralTasks.find(t => t.id === dt.id)) s.weeklyGeneralTasks.push({ ...dt });
    });
    s.customMandatory = { overrides: {}, hidden: [], customTasks: [] };
    s.customTasks = [];
    s.customShop = { categories: [], removedBuiltins: [], removedItems: [] };
    s.customQuotes = [];
    delete s.settings.energyBonus;
  }
  s.weeklyGeneralTasks.forEach(t => { if (!Array.isArray(t.days)) t.days = ['weekdays']; if (!t.kidId) t.kidId = 'all'; });
  s.bonusTasks.forEach(t => { if (!t.category) t.category = 'כללי'; });
  s.dayTasks.forEach(t => { if (!Array.isArray(t.days)) t.days = ['weekdays']; if (!t.kidId) t.kidId = 'all'; if (!t.type) t.type = 'mandatory'; });
  s.schema = 3;
  pruneState(s);
  return s;
}

function pruneState(s) {
  const cutoff = dateKey(daysAgo(KEEP_DAYS));
  ['taskChecks', 'bonusChecks', 'weeklyChecks', 'groupBonusGiven'].forEach(m => {
    const o = s[m]; if (!o) return;
    Object.keys(o).forEach(dk => { if (dk < cutoff) delete o[dk]; });
  });
  if (s.dayComplete) {
    const c2 = dateKey(daysAgo(400));
    Object.keys(s.dayComplete).forEach(dk => { if (dk < c2) delete s.dayComplete[dk]; });
  }
  if (s.streakBonusGiven) {
    Object.keys(s.streakBonusGiven).forEach(k => { const m = k.match(/(\d{4}-\d{2}-\d{2})/); if (m && m[1] < cutoff) delete s.streakBonusGiven[k]; });
  }
  if (s.familyChallengeCount) {
    const c3 = dateKey(daysAgo(7 * 12));
    Object.keys(s.familyChallengeCount).forEach(w => { if (w < c3) delete s.familyChallengeCount[w]; });
  }
  if (Array.isArray(s.parentMessages) && s.parentMessages.length > 100) s.parentMessages = s.parentMessages.slice(-100);
  if (Array.isArray(s.oneTimeTasks)) {
    const old = Date.now() - KEEP_DAYS * 86400000;
    s.oneTimeTasks = s.oneTimeTasks.filter(t => !(t.done && t.doneTs && t.doneTs < old));
  }
  if (Array.isArray(s.actionLog)) {
    // השרת מאשר מה הועבר לארכיון; בלי ענן — פשוט שומרים 60 יום
    const th = SCRIPT_URL ? (s.archivedThrough || 0) : Date.now() - KEEP_DAYS * 86400000;
    if (th) s.actionLog = s.actionLog.filter(x => !(x && x.ts && x.ts <= th));
    if (s.actionLog.length > 6000) s.actionLog = s.actionLog.slice(-6000);
  }
}

let state = normalizeState(loadState() || defaultState());
applyKidProfiles(state);

// SELECTED KID STATE

let selectedKid = 'hilel';
let selectedBonusKid = 'hilel';
let selectedWalletKid = 'hilel';

// ============================================================
// TASK CHECK HELPERS
// ============================================================
function getMandatoryChecks(kidId, date) {
  date = date || todayKey();
  if (!state.taskChecks[date]) state.taskChecks[date] = {};
  if (!state.taskChecks[date][kidId]) state.taskChecks[date][kidId] = {};
  return state.taskChecks[date][kidId];
}

function getBonusChecks(kidId, date) {
  date = date || todayKey();
  if (!state.bonusChecks[date]) state.bonusChecks[date] = {};
  if (!state.bonusChecks[date][kidId]) state.bonusChecks[date][kidId] = {};
  return state.bonusChecks[date][kidId];
}

function getWeeklyChecks(kidId, date) {
  date = date || todayKey();
  if (!state.weeklyChecks[date]) state.weeklyChecks[date] = {};
  if (!state.weeklyChecks[date][kidId]) state.weeklyChecks[date][kidId] = {};
  return state.weeklyChecks[date][kidId];
}

function isGroupBonusGiven(kidId, groupId) {
  const d = todayKey();
  return !!(state.groupBonusGiven[d] && state.groupBonusGiven[d][kidId] && state.groupBonusGiven[d][kidId][groupId]);
}

function markGroupBonus(kidId, groupId, value) {
  const d = todayKey();
  if (!state.groupBonusGiven[d]) state.groupBonusGiven[d] = {};
  if (!state.groupBonusGiven[d][kidId]) state.groupBonusGiven[d][kidId] = {};
  if (value === false) delete state.groupBonusGiven[d][kidId][groupId];
  else state.groupBonusGiven[d][kidId][groupId] = true;
}

// Regular (non-bonus) tasks of a time-of-day group, for one kid
function groupTasks(groupId, kidId) {
  return getDayTasks(kidId).filter(t => t.group === groupId && !isBonusTask(t));
}

function allGroupDone(kidId, groupId) {
  const checks = getMandatoryChecks(kidId);
  const tasks = groupTasks(groupId, kidId);
  return tasks.length > 0 && tasks.every(t => checks[t.id]);
}

function dayRegularTasks(kidId) {
  return getDayTasks(kidId).filter(t => !isBonusTask(t));
}

function allDayDone(kidId) {
  const checks = getMandatoryChecks(kidId);
  const tasks = dayRegularTasks(kidId);
  return tasks.length > 0 && tasks.every(t => checks[t.id]);
}

// ============================================================
// STREAK — מחושב מרשימת הימים שהושלמו במלואם
// ============================================================
function streakTarget() { const v = state.settings && state.settings.streakTarget; return v > 0 ? v : 7; }
function streakBonusAmount() { const v = state.settings && state.settings.streakBonus; return typeof v === 'number' ? v : 50; }

function isDayComplete(kidId, dk) {
  return !!(state.dayComplete[dk] && state.dayComplete[dk][kidId]);
}

// רצף = ימים רצופים שהושלמו, עד היום (או עד אתמול אם היום עוד לא הושלם)
function computeStreak(kidId) {
  const d = new Date();
  if (!isDayComplete(kidId, dateKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (n < 400 && isDayComplete(kidId, dateKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function getStreakBest(kidId) {
  return Math.max(state.streakBest[kidId] || 0, computeStreak(kidId));
}

function streakBonusKey(kidId, dk) { return kidId + '-' + dk + '-streak'; }

// נקרא אחרי סימון/ביטול של משימה רגילה. מחזיר מידע לחגיגה.
function updateDayCompletion(kidId, triggerTaskId) {
  const dk = todayKey();
  const done = allDayDone(kidId);
  const was = isDayComplete(kidId, dk);
  if (done && !was) {
    (state.dayComplete[dk] = state.dayComplete[dk] || {})[kidId] = true;
    const n = computeStreak(kidId);
    if (n > (state.streakBest[kidId] || 0)) state.streakBest[kidId] = n;
    const bk = streakBonusKey(kidId, dk);
    if (n > 0 && n % streakTarget() === 0 && !state.streakBonusGiven[bk]) {
      state.streakBonusGiven[bk] = true;
      earnShami(kidId, streakBonusAmount(), '🔥 בונוס רצף ' + n + ' ימים!', 's|' + dk + '|streak|' + triggerTaskId);
      return { streakBonus: n };
    }
    return { completed: true };
  }
  if (!done && was) {
    delete state.dayComplete[dk][kidId];
    if (!Object.keys(state.dayComplete[dk]).length) delete state.dayComplete[dk];
    const bk = streakBonusKey(kidId, dk);
    if (state.streakBonusGiven[bk]) {
      delete state.streakBonusGiven[bk];
      reverseOrCompensate(kidId, 's|' + dk + '|', streakBonusAmount(), 'ביטול בונוס רצף', true);
    }
  }
  return null;
}

function celebrateStreak(kidId, days) {
  const kid = KIDS[kidId];
  document.getElementById('cel-emoji').textContent = '🔥';
  document.getElementById('cel-title').textContent = kid.name + ' — רצף ' + days + ' ימים!';
  document.getElementById('cel-sub').textContent = 'השלמת את כל המשימות ' + days + ' ימים ברצף!';
  document.getElementById('cel-amount').textContent = '+' + streakBonusAmount() + ' שמי׳ז בונוס רצף 💰';
  document.getElementById('celebration').classList.add('show');
  launchConfetti(kid.color);
}

// ============================================================
// FAMILY CHALLENGE
// ============================================================
function getWeekKey() {
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
  return dateKey(d);
}

function addFamilyChallengeCount(delta) {
  const wk = getWeekKey();
  state.familyChallengeCount[wk] = Math.max(0, (state.familyChallengeCount[wk] || 0) + (delta === undefined ? 1 : delta));
}

function getFamilyChallengeCount() {
  return state.familyChallengeCount[getWeekKey()] || 0;
}

// ============================================================
// EARN / SPEND / LOG
// ============================================================
// ref מזהה את המקור של כל תנועה, כדי שאפשר יהיה לבטל אותה במדויק:
//   m|date|taskId  — בונוס על משימה        g|date|group|taskId — בונוס קבוצה
//   b|date|taskId  — משימת בונוס            w|date|taskId — משימה כללית
//   s|date|streak|taskId — בונוס רצף         ot|id — חד-פעמית   msg|id — בונוס בהודעה
let _lastTs = 0;
function uniqueTs() {
  let t = Date.now();
  if (t <= _lastTs) t = _lastTs + 1;
  _lastTs = t;
  return t;
}

function logAction(kidId, amount, action, balanceBefore, balanceAfter, ref) {
  const now = new Date();
  const e = {
    kidId, amount, action,
    balanceBefore, balanceAfter,
    date: now.toLocaleDateString('he-IL'),
    time: now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
    ts: uniqueTs()
  };
  if (ref) e.ref = ref;
  state.actionLog.push(e);
  return e;
}

function earnShami(kidId, amount, reason, ref) {
  const k = state.kids[kidId];
  const before = k.balance;
  k.balance += amount;
  if (amount > 0) k.totalEarned += amount;
  logAction(kidId, amount, reason, before, k.balance, ref);
  autoDailyBackup();
  saveState();
}

function spendShami(kidId, amount, reason, ref) {
  const k = state.kids[kidId];
  const before = k.balance;
  k.balance -= amount;
  logAction(kidId, -amount, reason, before, k.balance, ref);
  saveState();
}

// היסטוריה (לארנק/גרף/סטטיסטיקות) נגזרת מיומן הפעולות — מהחדש לישן
function getHistory(kidId) {
  const out = [];
  const log = state.actionLog || [];
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (kidId && e.kidId !== kidId) continue;
    out.push({ kidId: e.kidId, amount: e.amount, reason: e.action, date: e.ts ? dateKey(new Date(e.ts)) : '', time: e.time || '' });
  }
  return out;
}

// מסיר רשומה מהיומן ומחזיר את השפעתה על היתרה (היתרה יכולה לרדת מתחת ל-0)
function removeLogEntry(idx) {
  const e = state.actionLog[idx];
  if (!e) return;
  const k = state.kids[e.kidId];
  if (k) {
    k.balance -= e.amount;
    if (e.amount > 0) k.totalEarned = Math.max(0, k.totalEarned - e.amount);
  }
  state.actionLog.splice(idx, 1);
}

// מבטל תשלום לפי ref. אם הרשומה לא נמצאה (למשל נוצרה בגרסה הקודמת) —
// רושם תנועה הפוכה כדי שהכסף בכל זאת יחזור.
function reverseOrCompensate(kidId, ref, amount, label, isPrefix) {
  for (let i = state.actionLog.length - 1; i >= 0; i--) {
    const e = state.actionLog[i];
    if (e.kidId !== kidId || !e.ref) continue;
    if (isPrefix ? e.ref.indexOf(ref) === 0 : e.ref === ref) { removeLogEntry(i); return; }
  }
  if (amount) {
    const k = state.kids[kidId];
    const before = k.balance;
    k.balance -= amount;
    k.totalEarned = Math.max(0, k.totalEarned - amount);
    logAction(kidId, -amount, '↩️ ' + label, before, k.balance);
  }
}

// ============================================================
// UNDO LAST ACTION
// ============================================================
function undoLastAction() {
  const log = state.actionLog || [];
  if (!log.length) return;
  const last = log[log.length - 1];
  const kidName = KIDS[last.kidId] ? KIDS[last.kidId].name : '';
  const sign = last.amount > 0 ? '+' : '';
  const run = () => {
    if (!confirm(`לבטל את הפעולה האחרונה?\n${kidName}: ${last.action} (${sign}${last.amount} שמי׳ז)`)) return;
    undoEntry(last);
    saveState();
    renderAll();
  };
  // ביטול קנייה/מימוש מחזיר כסף — רק הורה
  if (last.amount < 0) requireParent(run, 'ביטול קנייה או מימוש');
  else run();
}

function undoEntry(e) {
  const ref = e.ref || '';
  const p = ref.split('|');
  const type = p[0];
  const isToday = p[1] === todayKey();
  // תנועה שנוצרה מסימון משימה היום → מבטלים את הסימון, והכסף חוזר איתו
  if (isToday && type === 'm' && getMandatoryChecks(e.kidId)[p[2]]) { toggleMandatory(p[2], e.kidId, { silent: true }); return; }
  if (isToday && (type === 'g' || type === 's') && p[3] && getMandatoryChecks(e.kidId)[p[3]]) { toggleMandatory(p[3], e.kidId, { silent: true }); return; }
  if (isToday && type === 'b' && getBonusChecks(e.kidId)[p[2]]) { toggleBonus(p[2], e.kidId, { silent: true }); return; }
  if (isToday && type === 'w' && getWeeklyChecks(e.kidId)[p[2]]) { toggleWeeklyGeneral(p[2], e.kidId, { silent: true }); return; }
  if (type === 'ot' || type === 'msg') {
    if (type === 'ot') {
      const t = (state.oneTimeTasks || []).find(x => x.id === p[1]);
      if (t) { t.done = false; delete t.doneTs; }
    }
    for (let i = state.actionLog.length - 1; i >= 0; i--) if (state.actionLog[i].ref === ref) removeLogEntry(i);
    return;
  }
  const idx = state.actionLog.lastIndexOf(e);
  if (idx !== -1) removeLogEntry(idx);
}

function updateUndoBtn() {
  const btn = document.getElementById('undo-btn');
  if (!btn) return;
  const hasLog = state.actionLog && state.actionLog.length > 0;
  btn.disabled = !hasLog;
  if (hasLog) {
    const last = state.actionLog[state.actionLog.length - 1];
    const kidName = KIDS[last.kidId]?.name || '';
    const sign = last.amount > 0 ? '+' : '';
    btn.title = `בטל: ${kidName} ${sign}${last.amount} שמי׳ז`;
  } else {
    btn.title = 'אין פעולה לביטול';
  }
}

// גיבוי מקומי יומי (3 ימים אחרונים). הגיבוי העיקרי נעשה בגוגל שיטס.
function autoDailyBackup() {
  const key = 'shami_backup_' + todayKey();
  if (!lsGet(key)) {
    for (let i = 3; i <= 40; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      lsDel('shami_backup_' + dateKey(d));
      lsDel('shami_backup_' + d.toISOString().slice(0,10));
    }
    lsSet(key, JSON.stringify(state));
  }
}

function exportLogCSV() {
  const logs = (state.actionLog || []).slice().reverse();
  const header = 'תאריך,שעה,ילד,פעולה,סכום,יתרה לפני,יתרה אחרי';
  const rows = logs.map(e => {
    const name = e.kidId === 'all' ? 'כולם' : (state.kidProfiles[e.kidId] || {}).name || e.kidId;
    return [e.date, e.time, name, '"' + (e.action||'').replace(/"/g,'""') + '"', e.amount, e.balanceBefore ?? '', e.balanceAfter ?? ''].join(',');
  });
  const csv = '﻿' + header + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'shamiz-log-' + todayKey() + '.csv';
  a.click();
}

function exportBackup() {
  const backup = JSON.stringify(state, null, 2);
  const blob = new Blob([backup], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'shamiz-backup-' + todayKey() + '.json';

}

function restoreBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const restored = JSON.parse(e.target.result);
      if (!restored.kids) { alert('קובץ לא תקין'); return; }
      if (!confirm('לשחזר מגיבוי? כל הנתונים הנוכחיים יוחלפו!')) return;
      const pin = state.parentPinHash;
      state = normalizeState(restored);
      if (pin && !state.parentPinHash) state.parentPinHash = pin;
      saveState();
      renderAll();
      alert('שוחזר בהצלחה! ✅');
      switchSettingsTab('log');
    } catch(err) {
      alert('שגיאה בקריאת הקובץ: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ============================================================
// TOGGLES — סימון נותן שמי׳ז, ביטול הסימון מחזיר אותם
// ============================================================
// כך אי אפשר "לחלוב" נקודות בסימון וביטול חוזרים.
function toggleMandatory(taskId, kidId, opts) {
  opts = opts || {};
  const task = getDayTasks(kidId).find(t => t.id === taskId) || findTaskAnyDay(taskId);
  if (!task) return;
  const dk = todayKey();
  const checks = getMandatoryChecks(kidId);
  const wasDone = !!checks[taskId];
  let cel = null;

  if (!wasDone) {
    checks[taskId] = true;
    if (isBonusTask(task)) {
      const amt = bonusAmountOf(task);
      if (amt) earnShami(kidId, amt, task.icon + ' ' + task.name + ' — בונוס!', 'm|' + dk + '|' + taskId);
      cel = { type: 'task', group: { label: task.name, emoji: task.icon }, amount: amt };
    } else {
      const g = GROUPS.find(gr => gr.id === task.group);
      if (g && allGroupDone(kidId, g.id) && !isGroupBonusGiven(kidId, g.id)) {
        markGroupBonus(kidId, g.id);
        const amt = groupBonusAmount(g.id);
        earnShami(kidId, amt, g.emoji + ' בונוס ' + g.label, 'g|' + dk + '|' + g.id + '|' + taskId);
        addFamilyChallengeCount(1);
        cel = { type: 'group', group: g, amount: amt };
      }
      const r = updateDayCompletion(kidId, taskId);
      if (r && r.streakBonus) cel = { type: 'streak', days: r.streakBonus };
    }
  } else {
    delete checks[taskId];
    if (isBonusTask(task)) {
      reverseOrCompensate(kidId, 'm|' + dk + '|' + taskId, bonusAmountOf(task), task.name);
    } else {
      const g = GROUPS.find(gr => gr.id === task.group);
      if (g && isGroupBonusGiven(kidId, g.id)) {
        markGroupBonus(kidId, g.id, false);
        reverseOrCompensate(kidId, 'g|' + dk + '|' + g.id + '|', groupBonusAmount(g.id), 'בונוס ' + g.label, true);
        addFamilyChallengeCount(-1);
      }
      updateDayCompletion(kidId, taskId);
    }
  }
  saveState();
  if (!opts.silent && cel) {
    if (cel.type === 'streak') celebrateStreak(kidId, cel.days);
    else celebrateGroupBonus(kidId, cel.group, cel.amount);
  }
  renderToday();
  updateUndoBtn();
}

// משימות "כללי" (ימי חול) — פעם אחת ביום, לחיצה נוספת מבטלת
function toggleWeeklyGeneral(taskId, kidId, opts) {
  opts = opts || {};
  const task = state.weeklyGeneralTasks.find(t => t.id === taskId);
  if (!task) return;
  const checks = getWeeklyChecks(kidId);
  const dk = todayKey();
  if (!checks[taskId]) {
    checks[taskId] = 1;
    earnShami(kidId, task.reward, task.icon + ' ' + task.name, 'w|' + dk + '|' + taskId);
    if (!opts.silent) celebrate(kidId, task);
  } else {
    delete checks[taskId];
    reverseOrCompensate(kidId, 'w|' + dk + '|' + taskId, task.reward, task.name);
    saveState();
  }
  renderToday();
  updateUndoBtn();
}

// משימות בונוס (טאב "בונוס") — פעם אחת ביום לכל ילד, לחיצה נוספת מבטלת
function toggleBonus(taskId, kidId, opts) {
  opts = opts || {};
  const task = state.bonusTasks.find(t => t.id === taskId);
  if (!task) return;
  const checks = getBonusChecks(kidId);
  const dk = todayKey();
  if (!checks[taskId]) {
    checks[taskId] = 1;
    earnShami(kidId, task.reward, task.icon + ' ' + task.name, 'b|' + dk + '|' + taskId);
    if (!opts.silent) celebrate(kidId, task);
  } else {
    delete checks[taskId];
    reverseOrCompensate(kidId, 'b|' + dk + '|' + taskId, task.reward, task.name);
    saveState();
  }
  renderBonusList();
  renderKidSelector('bonus-kid-selector', selectedBonusKid, 'selectBonusKid');
  updateUndoBtn();
}

// ============================================================
// STREAK CARDS
// ============================================================
function getStreakLevel(count) {
  if (count >= 6) return 'hot';
  if (count >= 3) return 'warm';
  return 'cold';
}

function renderStreakCards() {
  const kidKeys = Object.keys(KIDS);
  let html = `<div class="streak-grid" style="grid-template-columns:repeat(${Math.max(1, kidKeys.length)},1fr)">`;
  kidKeys.forEach(kidId => {
    const kid = KIDS[kidId];
    const count = computeStreak(kidId);
    const level = getStreakLevel(count);
    const remaining = streakTarget() - (count % streakTarget());
    const isAtTarget = count > 0 && count % streakTarget() === 0;
    const posInCycle = count % streakTarget();
    const dotsHtml = Array.from({length: streakTarget()}, (_,i) =>
      `<div class="streak-dot ${i < posInCycle || isAtTarget ? 'filled ' + level : ''}"></div>`
    ).join('');

    let msg, msgClass;
    if (isAtTarget && isDayComplete(kidId, todayKey())) {
      msg = '🎯 קיבלת בונוס היום!'; msgClass = 'hot';
    } else if (count === 0) {
      msg = 'התחל היום! 💪'; msgClass = 'cold';
    } else if (remaining === 1) {
      msg = '🔥 עוד יום לבונוס!'; msgClass = level;
    } else {
      msg = `עוד ${remaining} ימים ← +${streakBonusAmount()} 💰`; msgClass = level;
    }

    let streakEmoji = '❄️';
    if (level === 'warm') streakEmoji = '🔥';
    if (level === 'hot')  streakEmoji = '⭐';

    html += `<div class="streak-card ${level}" onclick="openStreakPopup('${kidId}')">
      <span class="streak-emoji">${esc(kid.emoji)}</span>
      <div class="streak-name" style="color:${kid.color}">${esc(kid.name)}</div>
      <div class="streak-dots">${dotsHtml}</div>
      <div class="streak-count" style="color:${level==='cold'?'var(--text2)':level==='warm'?'#E67E22':'#D4A017'}">${count} ${streakEmoji}</div>
      <div class="streak-label">ימים ברצף</div>
      <div class="streak-msg ${msgClass}">${esc(msg)}</div>
    </div>`;
  });
  html += '</div>';

  const el = document.getElementById('streak-cards');
  if (el) el.innerHTML = html;
}

function openStreakPopup(kidId) {
  const kid = KIDS[kidId];
  const count = computeStreak(kidId);
  const best = getStreakBest(kidId);
  const level = getStreakLevel(count);
  const remaining = streakTarget() - (count % streakTarget());

  document.getElementById('sp-emoji').textContent = level==='hot' ? '⭐' : level==='warm' ? '🔥' : '❄️';
  document.getElementById('sp-title').textContent = kid.name + ' — ' + count + ' ימים!';
  document.getElementById('sp-sub').textContent = count === 0
    ? 'השלם את כל המשימות היום כדי להתחיל רצף!'
    : `כל יום שמשלימים את כל החובות — הרצף גדל. אחרי ${streakTarget()} ימים ← ${streakBonusAmount()} שמי׳ז!`;
  document.getElementById('sp-record-val').textContent = best + ' ימים';
  document.getElementById('sp-next').textContent = count > 0
    ? `עוד ${remaining} ימים לבונוס הבא של ${streakBonusAmount()} שמי׳ז 💰`
    : '';
  document.getElementById('streak-popup').classList.add('show');
}

function closeStreakPopup() {
  document.getElementById('streak-popup').classList.remove('show');
}

      html += `<div class="task-item bonus-item" onclick="completeOneTimeTask('${t.id}')">
        <div class="task-check"></div>
        <div class="task-icon">${esc(t.icon || '⚡')}</div>
        <div class="task-info"><div class="task-name">${esc(t.name)}</div>
          <div class="task-sub">${t.kidId === 'all' ? 'לכולם (כל אחד מקבל)' : 'ל' + esc(KIDS[t.kidId].name)}</div></div>
        <div class="task-reward reward-bonus">+${esc(t.reward)} 💰</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<div class="all-kids-grid" style="grid-template-columns:repeat(${Math.max(1, kidKeys.length)},1fr)">`;

  kidKeys.forEach(kidId => {
    const kid = KIDS[kidId];
    const kd = state.kids[kidId];
    const checks = getMandatoryChecks(kidId);
    const wChecks = getWeeklyChecks(kidId);
    const dayTasks = getDayTasks(kidId);

    const regular = dayTasks.filter(t => !isBonusTask(t));
    const totalTasks = regular.length;
    const totalDone = regular.filter(t => checks[t.id]).length;
    const allComplete = totalTasks > 0 && totalDone === totalTasks;

    html += `<div class="kid-column" style="border-top: 3px solid ${kid.color}">
      <div class="kid-col-header" style="background:${kid.color}11">
        <span class="kid-col-emoji">${esc(kid.emoji)}</span>
        <div class="kid-col-name" style="color:${kid.color}">${esc(kid.name)}</div>
        <div class="kid-col-balance" style="${kd.balance < 0 ? 'color:#E74C3C' : ''}">${kd.balance} שמי׳ז</div>
        <span class="kid-col-bonus-badge" style="background:#F0F0F0;color:#888">${totalDone}/${totalTasks}</span>
      </div>
      <div class="kid-col-body">
        ${allComplete ? `<div class="day-done-banner">🎉 יום הושלם!</div>` : ''}`;

    GROUPS.forEach(g => {
      const tasks = regular.filter(t => t.group === g.id);
      const bonuses = dayTasks.filter(t => t.group === g.id && isBonusTask(t));
      if (!tasks.length && !bonuses.length) return;
      const done = tasks.filter(t => checks[t.id]).length;
      const total = tasks.length;
      const allDone = total > 0 && done === total;
      const bonusGiven = isGroupBonusGiven(kidId, g.id);
      const pct = total ? Math.round(done/total*100) : 0;

      html += `<div class="mini-group-label ${allDone ? 'mini-group-done' : ''}">
        ${g.emoji} ${g.label}
        ${allDone && bonusGiven ? '<span style="color:#27AE60">+' + groupBonusAmount(g.id) + '✓</span>' : ''}
      </div>
      <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct}%;background:${allDone?'#2ECC71':kid.color}"></div></div>`;

      tasks.forEach(t => { html += taskRow(t, kidId, !!checks[t.id], '', ''); });
      bonuses.forEach(t => { html += taskRow(t, kidId, !!checks[t.id], 'energy', ' +' + bonusAmountOf(t) + '💰'); });
    });

    // משימות כלליות — בימי חול בלבד, פעם ביום
    const general = state.weeklyGeneralTasks.filter(t => (t.days || ['weekdays']).includes(getDayType()) && (!t.kidId || t.kidId === 'all' || t.kidId === kidId));
    if (general.length) {
      html += `<div class="mini-group-label">🛒 כללי</div>`;
      general.forEach(t => {
        const isDone = !!wChecks[t.id];
        html += `<div class="mini-task weekly-gen ${isDone ? 'done' : ''}" onclick="toggleWeeklyGeneral('${t.id}','${kidId}')">
          <div class="mini-check" style="${isDone?'background:#2ECC71;border-color:#2ECC71;color:white;':'border-color:#9AE6B4;'}">${isDone ? '✓' : ''}</div>
          <span class="mini-task-icon">${esc(t.icon)}</span>
          <span class="mini-task-name">${esc(t.name)} +${esc(t.reward)}💰</span>
        </div>`;
      });
    }

    html += `</div></div>`;
  });

  html += '</div>';
  el.innerHTML = html;
}

function selectBonusKid(k) {
  selectedBonusKid = k;
  renderKidSelector('bonus-kid-selector', selectedBonusKid, 'selectBonusKid');
  renderBonusList();
}

function renderBonusList() {
  const checks = getBonusChecks(selectedBonusKid);
  const assign = state.weeklyAssign;

  const myTasks = state.bonusTasks.filter(t => { const a = assign[t.id]; return !a || a === selectedBonusKid; });
  const otherTasks = state.bonusTasks.filter(t => { const a = assign[t.id]; return a && a !== selectedBonusKid; });

  // Group myTasks by category
  const categories = [];
  const seen = new Set();
  myTasks.forEach(t => {
    const cat = t.category || 'כללי';
    if (!seen.has(cat)) { seen.add(cat); categories.push(cat); }
  });

  let html = '';

  if (!myTasks.length) {
    html = `<div class="empty"><div class="empty-icon">📭</div>אין משימות בונוס משובצות</div>`;
  } else {
    categories.forEach(cat => {
      const catTasks = myTasks.filter(t => (t.category || 'כללי') === cat);
      html += `<div class="section-header" style="margin-top:14px;">
        <span class="section-badge badge-bonus">⭐ ${esc(cat)}</span>
      </div><div class="task-list">`;
      catTasks.forEach(t => {
        const count = checks[t.id] || 0;
        html += `
          <div class="task-item bonus-item ${count > 0 ? 'done' : ''}" onclick="toggleBonus('${t.id}','${selectedBonusKid}')">
            <div class="task-check">${count > 0 ? '✓' : ''}</div>
            <div class="task-icon">${esc(t.icon)}</div>
            <div class="task-info">
              <div class="task-name">${esc(t.name)}</div>
              <div class="task-sub">${count > 0 ? 'בוצע היום ✓ · לחיצה נוספת מבטלת' : 'לחץ לסמן ביצוע (פעם ביום)'}</div>
            </div>
            <div class="task-reward reward-bonus">+${esc(t.reward)} 💰</div>
          </div>`;
      });
      html += `</div>`;
    });
  }

  if (otherTasks.length) {
    html += `<div class="section-header" style="margin-top:16px;">
      <span class="section-title-text" style="font-size:0.9rem;color:var(--text2)">משובץ לאחר השבוע</span>
    </div><div class="task-list">`;
    otherTasks.forEach(t => {
      const assignedTo = KIDS[assign[t.id]]?.name || '';
      html += `
        <div class="task-item bonus-item" style="opacity:0.4;cursor:default;">
          <div class="task-icon">${esc(t.icon)}</div>
          <div class="task-info">
            <div class="task-name">${esc(t.name)}</div>
            <div class="task-sub">משובץ ל${esc(assignedTo)}</div>
          </div>
          <div class="task-reward reward-bonus">+${esc(t.reward)} 💰</div>
        </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('bonus-list').innerHTML = html;
}

function selectWalletKid(k) {

function renderWallet() {
  const kid = KIDS[selectedWalletKid];
  const kd = state.kids[selectedWalletKid];
  const allHist = getHistory(selectedWalletKid);
  const history = allHist.slice(0, 20);

  const nisValue = Math.floor(kd.balance / nisRate());
  const todayEarned = allHist.filter(h => h.date === todayKey() && h.amount > 0).reduce((s,h) => s + h.amount, 0);

  let html = `
    <div class="wallet-card">
      <div class="wallet-name">${esc(kid.emoji)} ${esc(kid.name)}</div>
      <div class="wallet-balance" style="${kd.balance < 0 ? 'color:#FF8A80' : ''}">${kd.balance}</div>
      <div class="wallet-unit">שטרות שמי׳ז</div>
      <div class="nis-rate">≈ ${nisValue} ₪ אמיתיים (${nisRate()} שמי׳ז = 1 ₪)</div>
      <div class="wallet-stats">
        <div class="w-stat">
          <div class="w-stat-val">+${todayEarned}</div>
          <div class="w-stat-lbl">הרוויח היום</div>
        </div>
        <div class="w-stat">
          <div class="w-stat-val">${kd.totalEarned}</div>
          <div class="w-stat-lbl">סה"כ הרוויח</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn-add" style="flex:1;background:#E74C3C;color:white;" onclick="requireParent(() => redeemShami('${selectedWalletKid}'), 'מימוש שמי׳ז')">🔒 💸 מימוש</button>
      <button class="btn-add" style="flex:1;" onclick="requireParent(() => addShami('${selectedWalletKid}'), 'הוספה ידנית')">🔒 ➕ הוסף ידנית</button>
    </div>

    <div class="section-header"><span class="section-title-text">📜 היסטוריה</span></div>
    <div class="task-list">`;

  if (!history.length) {
    html += `<div class="empty"><div class="empty-icon">📭</div>עוד אין היסטוריה</div>`;
  } else {
    history.forEach(h => {
      html += `
        <div class="history-item">
          <div class="hi-icon">${h.amount > 0 ? '💰' : '💸'}</div>
          <div class="hi-info">
            <div class="hi-name">${esc(h.reason)}</div>
            <div class="hi-meta">${h.date} · ${h.time}</div>
          </div>
          <div class="hi-amount" style="color:${h.amount > 0 ? '#27AE60' : '#E74C3C'}">${h.amount > 0 ? '+' : ''}${h.amount} שמי׳ז</div>
        </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('wallet-content').innerHTML = html;
}

function redeemShami(kidId) {
  const amount = parseInt(prompt(`כמה שטרות שמי׳ז לממש עבור ${KIDS[kidId].name}? (יתרה: ${state.kids[kidId].balance})`));
  if (!amount || isNaN(amount) || amount <= 0) return;
  if (amount > state.kids[kidId].balance) { alert('אין מספיק שטרות!'); return; }
  const reason = prompt('סיבת המימוש:') || 'מימוש';
  spendShami(kidId, amount, '💸 ' + reason, 'redeem');
  renderWallet();
  renderKidSelector('wallet-kid-selector', selectedWalletKid, 'selectWalletKid');
}

function addShami(kidId) {
  const amount = parseInt(prompt(`כמה שטרות שמי׳ז להוסיף ל${KIDS[kidId].name}?`));
  if (!amount || isNaN(amount) || amount <= 0) return;
  const reason = prompt('סיבה:') || 'הוספה ידנית';
  earnShami(kidId, amount, '➕ ' + reason, 'add');
  renderWallet();
  renderKidSelector('wallet-kid-selector', selectedWalletKid, 'selectWalletKid');
}

          <div><div style="font-family:'Fredoka One',cursive;font-size:1.3rem;color:#D35400">${kd.balance}</div><div style="font-size:0.7rem;color:var(--text2)">יתרה</div></div>
          <div><div style="font-family:'Fredoka One',cursive;font-size:1.3rem;color:#27AE60">+${weekEarned}</div><div style="font-size:0.7rem;color:var(--text2)">השבוע</div></div>
          <div><div style="font-family:'Fredoka One',cursive;font-size:1.3rem">${kd.totalEarned}</div><div style="font-size:0.7rem;color:var(--text2)">סה"כ</div></div>

        </div>
      </div>`;
    });

          </div>`;
      });
      html += `</div>`;
    }
    el.innerHTML = html;

  } else if (settingsTab === 'reset') {
    el.innerHTML = `
      <div class="settings-title" style="margin-top:8px;">🔄 איפוס</div>
      <p style="font-size:0.82rem;color:var(--text2);margin-bottom:12px;">פעולות האיפוס משפיעות על כל הילדים.</p>
      <button class="reset-btn" onclick="resetToday()">🔄 אפס סימוני היום (שמור יתרות)</button>
      <button class="reset-btn" style="margin-top:8px;" onclick="resetAll()">⚠️ אפס הכל לגמרי</button>`;
  }
}

function resetFamilyChallenge() {
  if (!confirm('לאפס את ספירת האתגר השבועי?')) return;
  const wk = getWeekKey();
  state.familyChallengeCount[wk] = 0;
  saveState();
  renderSettingsTab();
  renderTodayHeader();
}

function resetToday() {
  if (!confirm('לאפס את כל סימוני היום?')) return;
  const today = todayKey();
  delete state.taskChecks[today];
  delete state.bonusChecks[today];
  delete state.weeklyChecks[today];
  delete state.groupBonusGiven[today];
  delete state.dayComplete[today];
  saveState();
  renderAll();
}

function resetAll() {
  if (!confirm('⚠️ לאפס הכל לגמרי כולל יתרות? פעולה זו אינה הפיכה!')) return;
  if (!confirm('בטוח? כל היתרות, ההיסטוריה וההגדרות יימחקו בכל המכשירים.\n(גיבוי יומי נשמר בגוגל שיטס בלשונית "גיבוי יומי")')) return;
  const pin = state.parentPinHash;
  state = normalizeState(defaultState());
  if (pin) state.parentPinHash = pin;
  saveState();
  renderAll();
}

function closeCelebration() {

function launchConfetti(color) {
  const colors = [color, '#F4C430', '#2ECC71', '#E74C3C', '#9B59B6'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');

    setTimeout(() => c.remove(), 3500);
  }
}

function selectShopKid(k) {

function renderShop() {
  const kid = KIDS[selectedShopKid];
  const kd = state.kids[selectedShopKid];

  let html = `
    <div class="shop-balance-bar">
      <div>
        <div class="sbb-name">${esc(kid.emoji)} ${esc(kid.name)}</div>
        <div class="sbb-label">היתרה שלך</div>
      </div>
      <div style="text-align:left;">
        <div class="sbb-balance">${kd.balance} שמי׳ז</div>
        <div class="sbb-label">≈ ${Math.floor(kd.balance/nisRate())} ₪</div>
      </div>
    </div>`;

  getShopCategories().forEach(cat => {
    html += `<div class="shop-cat-header">
      <span class="shop-cat-emoji">${esc(cat.emoji)}</span>
      <span class="shop-cat-label">${esc(cat.label)}</span>
    </div>
    <div class="shop-grid">`;

    cat.items.forEach(item => {
      const canAfford = kd.balance >= item.cost;
      html += `

          <div class="shop-item-name">${esc(item.name)}</div>
          <div class="shop-item-desc">${esc(item.desc)}</div>
          <div class="shop-item-cost">💰 ${item.cost}</div>
          ${!canAfford ? `<div style="font-size:0.68rem;color:#E74C3C;margin-top:5px;">חסרים עוד ${item.cost - kd.balance}</div>` : ''}

  });

  document.getElementById('shop-content').innerHTML = html;
}

function openConfirm(itemId) {
  const item = getShopCategories().flatMap(c => c.items).find(i => i.id === itemId);
  if (!item) return;
  pendingPurchase = { itemId, kidId: selectedShopKid };
  document.getElementById('confirm-icon').textContent = item.icon;
  document.getElementById('confirm-title').textContent = item.name;
  document.getElementById('confirm-desc').textContent = item.desc;
  document.getElementById('confirm-cost').textContent = `${item.cost} שטרות שמי׳ז 💰`;
  document.getElementById('confirm-modal').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('show');
  pendingPurchase = null;
}

function confirmPurchase() {
  if (!pendingPurchase) return;
  const { itemId, kidId } = pendingPurchase;
  const item = getShopCategories().flatMap(c => c.items).find(i => i.id === itemId);
  if (!item) return;
  closeConfirm();
  spendShami(kidId, item.cost, item.icon + ' ' + item.name);

  // Celebrate purchase
  const kid = KIDS[kidId];
  document.getElementById('cel-emoji').textContent = item.icon;
  document.getElementById('cel-title').textContent = `נהנה/י ${kid.name}! 🎉`;
  document.getElementById('cel-sub').textContent = item.name;
  document.getElementById('cel-amount').textContent = `-${item.cost} שמי׳ז · נשאר: ${state.kids[kidId].balance}`;
  document.getElementById('celebration').classList.add('show');
  launchConfetti(kid.color);
  renderShop();
  renderKidSelector('shop-kid-selector', selectedShopKid, 'selectShopKid');
}

function showCantAfford() {
  const kd = state.kids[selectedShopKid];
  document.getElementById('cel-emoji').textContent = '😅';
  document.getElementById('cel-title').textContent = 'עוד לא...';

function showPage(name, btn) {

    requireParent(() => showPage('settings', btn), 'הגדרות');

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  if (name === 'settings') renderSettings();
}

function renderGraph() {
  const kidKeys = Object.keys(KIDS);
  const kidHist = {};
  kidKeys.forEach(k => { kidHist[k] = getHistory(k); });
  const days = 14;
  const labels = [];
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    labels.push(d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }));
  }

  // Build per-kid per-day earnings
  const datasets = kidKeys.map(k => {
    const kid = KIDS[k];
    const data = labels.map((_, i) => {
      const key = dateKey(daysAgo(days-1-i));
      return kidHist[k].filter(h => h.date===key && h.amount>0).reduce((s,h)=>s+h.amount,0);
    });
    return { name: kid.name, color: kid.color, emoji: kid.emoji, data };
  });

  const maxVal = Math.max(...datasets.flatMap(d=>d.data), 10);
  const chartH = 160;

  let html = `<div class="settings-title" style="margin-top:8px;">📊 רווחים ב-14 הימים האחרונים</div>
    <div style="background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto;">
      <svg width="100%" viewBox="0 0 560 ${chartH+60}" xmlns="http://www.w3.org/2000/svg" style="min-width:400px;">`;

  // Grid lines
  for (let i = 0; i <= 4; i++) {
    const y = chartH - (i/4)*chartH + 10;
    const val = Math.round((i/4)*maxVal);
    html += `<line x1="40" y1="${y}" x2="555" y2="${y}" stroke="#E8DDD0" stroke-width="1"/>
             <text x="36" y="${y+4}" text-anchor="end" font-size="9" fill="#7A6A5A">${val}</text>`;
  }

  // Lines per kid
  const xStep = 515 / (days-1);
  datasets.forEach(ds => {
    const points = ds.data.map((v,i) => `${40+i*xStep},${chartH - (v/maxVal)*chartH + 10}`).join(' ');
    html += `<polyline points="${points}" fill="none" stroke="${ds.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    ds.data.forEach((v,i) => {
      if (v > 0) html += `<circle cx="${40+i*xStep}" cy="${chartH-(v/maxVal)*chartH+10}" r="4" fill="${ds.color}"/>`;
    });
  });

  // X labels (every other day)
  labels.forEach((l,i) => {
    if (i % 2 === 0) html += `<text x="${40+i*xStep}" y="${chartH+28}" text-anchor="middle" font-size="8" fill="#7A6A5A">${l}</text>`;
  });

  html += `</svg>
      <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;">
        ${datasets.map(ds=>`<span style="font-size:0.8rem;color:${ds.color};font-weight:700;">${esc(ds.emoji)} ${esc(ds.name)}</span>`).join('')}
      </div>
    </div>`;

  // Per kid total summary cards
  html += `<div style="display:grid;grid-template-columns:repeat(${Math.max(1, kidKeys.length)},1fr);gap:10px;margin-bottom:16px;">`;
  kidKeys.forEach(k => {
    const kid = KIDS[k]; const kd = state.kids[k];
    const streakCount = computeStreak(k);
    const weekEarned = kidHist[k].filter(h=>h.amount>0&&h.date>=dateKey(daysAgo(7))).reduce((s,h)=>s+h.amount,0);
    html += `<div style="background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);border-top:3px solid ${kid.color}">
      <div style="font-size:1.5rem">${esc(kid.emoji)}</div>
      <div style="font-family:'Fredoka One',cursive;color:${kid.color};font-size:0.95rem">${esc(kid.name)}</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.4rem;color:#D35400">${kd.balance}</div>
      <div style="font-size:0.65rem;color:var(--text2)">יתרה</div>
      <div style="font-size:0.8rem;margin-top:6px">🔥 ${streakCount} ימים</div>
      <div style="font-size:0.72rem;color:#27AE60">+${weekEarned} השבוע</div>
    </div>`;
  });
  html += `</div>`;

  document.getElementById('graph-content').innerHTML = html;
}

function completeOneTimeTask(id) {
  const task = state.oneTimeTasks.find(t => t.id === id);
  if (!task || task.done) return;
  task.done = true;
  task.doneTs = Date.now();
  const kids = task.kidId === 'all' ? Object.keys(KIDS) : [task.kidId];
  kids.forEach(k => earnShami(k, task.reward, task.icon + ' ' + task.name, 'ot|' + task.id));
  saveState();
  const who = task.kidId === 'all' ? 'כולם' : (KIDS[task.kidId] ? KIDS[task.kidId].name : '');
  const color = task.kidId !== 'all' && KIDS[task.kidId] ? KIDS[task.kidId].color : '#F4C430';
  celebrateCustom(task.icon || '⚡', 'כל הכבוד ' + who + '!', task.name, '+' + task.reward + ' שטרות שמי׳ז 💰' + (kids.length > 1 ? ' לכל אחד' : ''), color);
  renderGraph();
  updateUndoBtn();
}

function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showParentMessages() {
  const unread = (state.parentMessages||[]).filter(m => !m.read);
  if (unread.length) {
    unread.forEach(m => m.read = true);
    saveState();
  }
  renderTodayHeader();
  renderParentMsgList();
  const sel = document.getElementById('parent-msg-target');
  if (sel && !sel.options.length) {
    sel.innerHTML = '<option value="all">לכולם</option>' + Object.entries(KIDS).map(([k, kid]) => `<option value="${k}">${esc(kid.name)}</option>`).join('');
  }
  document.getElementById('parent-msg-modal').classList.add('show');
}

function closeParentMessages() {
  document.getElementById('parent-msg-modal').classList.remove('show');
}

function renderParentMsgList() {
  const msgs = (state.parentMessages||[]).slice().reverse();
  const el = document.getElementById('parent-msg-list');
  if (!el) return;
  if (!msgs.length) { el.innerHTML = '<div class="empty">עוד אין הודעות</div>'; return; }
  el.innerHTML = msgs.map(m => {
    const who = !m.target || m.target === 'all' ? 'לכולם' : 'ל' + (KIDS[m.target] ? KIDS[m.target].name : m.target);
    return `
    <div style="background:${m.isBonus?'#D5F5E3':'var(--card2)'};border-radius:12px;padding:12px 14px;margin-bottom:8px;border-right:3px solid ${m.isBonus?'#2ECC71':'var(--gold)'};">
      ${m.isBonus?`<div style="font-family:'Fredoka One',cursive;color:#27AE60;font-size:0.9rem;">🎁 בונוס: +${m.bonus} שמי׳ז ${esc(who)}!</div>`:''}
      <div style="font-size:0.88rem;font-weight:600;">${esc(m.text)}</div>
      <div style="font-size:0.7rem;color:var(--text2);margin-top:4px;">${m.date} · ${m.time}</div>
    </div>`;
  }).join('');
}

function sendParentMessage() {
  const text = document.getElementById('parent-msg-input').value.trim();
  const amtEl = document.getElementById('parent-msg-bonus');
  const bonus = amtEl ? (parseInt(amtEl.value) || 0) : 0;
  const target = (document.getElementById('parent-msg-target') || {}).value || 'all';
  if (!text && !bonus) return;
  const send = () => {
    const now = new Date();
    const msg = {
      id: 'pm' + now.getTime(),
      ts: now.getTime(),
      text: text || '🎁 בונוס מההורים',
      read: false,
      date: now.toLocaleDateString('he-IL'),
      time: now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),
      isBonus: bonus > 0,
    };
    if (bonus > 0) {
      msg.bonus = bonus;
      msg.target = target;
      const kids = target === 'all' ? Object.keys(KIDS) : [target];
      kids.forEach(k => earnShami(k, bonus, '📨 ' + msg.text, 'msg|' + msg.id));
    }
    state.parentMessages.push(msg);
    saveState();
    document.getElementById('parent-msg-input').value = '';
    if (amtEl) amtEl.value = '';
    renderParentMsgList();
    renderTodayHeader();
    renderWallet();
    updateUndoBtn();
  };
  // בונוס = הוספת כסף → רק הורה. הודעה רגילה — פתוח לכולם.
  if (bonus > 0) requireParent(send, 'בונוס בהודעה');
  else send();
}

      if (f && f.cat === target) { Object.assign(f.item, o); return; }
