      target.items.push(o);
    },
    remove: id => { state.shop.forEach(c => { c.items = c.items.filter(i => i.id !== id); }); },
  },
  shopCat: {
    title: 'קטגוריה בחנות',
    fields: [{ k: 'emoji', label: 'אייקון', type: 'icon' }, { k: 'label', label: 'שם הקטגוריה', type: 'text', required: true }],
    get: id => { const c = state.shop.find(x => x.id === id); return { id: c.id, emoji: c.emoji, label: c.label }; },
    create: () => ({ id: newId('cat'), emoji: '🎁', label: '' }),
    save: (o, isNew) => {
      if (isNew) state.shop.push({ id: o.id, emoji: o.emoji, label: o.label, items: [] });
      else Object.assign(state.shop.find(c => c.id === o.id), { emoji: o.emoji, label: o.label });
    },
    remove: id => { state.shop = state.shop.filter(c => c.id !== id); },
    confirmRemove: 'למחוק את הקטגוריה וכל הפרסים שבה?',
  },
  quote: {
    title: 'ציטוט',
    fields: [{ k: 'text', label: 'הציטוט', type: 'textarea', required: true }, { k: 'author', label: 'מאת', type: 'text' }],
    get: id => clone(state.quotes.find(q => q.id === id)),
    create: () => ({ id: newId('q'), text: '', author: '' }),
    save: (o, isNew) => {
      o.author = o.author || 'לא ידוע';
      if (isNew) state.quotes.push(o);
      else Object.assign(state.quotes.find(q => q.id === o.id), o);
    },
    remove: id => { state.quotes = state.quotes.filter(q => q.id !== id); },
  },
  kid: {
    title: 'ילד/ה',
    fields: [
      { k: 'emoji', label: 'אימוג׳י', type: 'icon' },
      { k: 'name', label: 'שם', type: 'text', required: true },
      { k: 'color', label: 'צבע', type: 'color' },
      { k: 'hidden', label: 'מוסתר/ת (לא מוצג באפליקציה, היתרה נשמרת)', type: 'toggle' },
    ],
    get: id => Object.assign({ id }, clone(state.kidProfiles[id])),
    create: () => ({ id: newId('k'), emoji: '🙂', name: '', color: '#3498DB', hidden: false }),
    save: (o, isNew) => {
      const id = o.id; delete o.id;
      if (o.hidden) {
        const visible = Object.keys(state.kidProfiles).filter(k => k !== id && !state.kidProfiles[k].hidden);
        if (!visible.length) { alert('חייב להישאר לפחות ילד אחד מוצג'); o.hidden = false; }
      }
      if (isNew) {
        o.order = Math.max(-1, ...Object.values(state.kidProfiles).map(p => p.order || 0)) + 1;
        state.kidProfiles[id] = o;
        state.kids[id] = { balance: 0, totalEarned: 0 };
      } else {
        Object.assign(state.kidProfiles[id], o);
      }
      applyKidProfiles();
    },
    noDelete: true,
  },
};

// ---------- החלון ----------
function openEditor(kind, id, preset) {
  requireParent(() => {
    const K = EDIT_KINDS[kind];
    const isNew = !id || id === 'null';
    const obj = isNew ? K.create(preset) : K.get(id);
    if (!obj) return;
    editorState = { kind, id: obj.id, isNew, obj };
    document.getElementById('edit-title').textContent = (isNew ? 'הוספת ' : 'עריכת ') + K.title;
    document.getElementById('edit-delete').style.display = (isNew || K.noDelete) ? 'none' : 'block';
    document.getElementById('edit-error').textContent = '';
    renderEditorFields();
    document.getElementById('edit-modal').classList.add('show');
    setTimeout(() => { const f = document.querySelector('#edit-fields [data-k="name"], #edit-fields [data-k="label"], #edit-fields [data-k="text"]'); if (f && isNew) f.focus(); }, 60);
  }, 'עריכה');
}

function renderEditorFields() {
  const K = EDIT_KINDS[editorState.kind];
  const o = editorState.obj;
  const html = K.fields.filter(f => !f.showIf || f.showIf(o)).map(f => {
    const v = o[f.k];
    let input;
    if (f.type === 'icon') input = `<input class="f-input ed-icon" data-k="${f.k}" value="${esc(v || '')}" maxlength="8" />`;
    else if (f.type === 'text') input = `<input class="f-input" data-k="${f.k}" value="${esc(v || '')}" ${f.list ? `list="dl-${f.k}"` : ''} />` +
      (f.list ? `<datalist id="dl-${f.k}">${f.list().map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '');
    else if (f.type === 'textarea') input = `<textarea class="f-input" data-k="${f.k}" rows="3">${esc(v || '')}</textarea>`;
    else if (f.type === 'number') input = `<input class="f-input" type="number" min="0" inputmode="numeric" data-k="${f.k}" value="${v === undefined ? '' : v}" />`;
    else if (f.type === 'select') input = `<select class="f-input" data-k="${f.k}" onchange="editorFieldChanged()">${f.options().map(op => `<option value="${esc(op.value)}" ${String(op.value) === String(v) ? 'selected' : ''}>${esc(op.label)}</option>`).join('')}</select>`;
    else if (f.type === 'days') input = `<div class="ed-days" data-k="${f.k}" data-type="days">${Object.keys(DAY_LABELS).map(d => `<label><input type="checkbox" value="${d}" ${(v || []).includes(d) ? 'checked' : ''}/> ${DAY_LABELS[d]}</label>`).join('')}</div>`;
    else if (f.type === 'toggle') input = `<label class="ed-toggle"><input type="checkbox" data-k="${f.k}" data-type="toggle" ${v ? 'checked' : ''}/> ${f.label}</label>`;
    else if (f.type === 'color') input = `<div class="ed-colors"><input type="color" data-k="${f.k}" value="${esc(v || '#3498DB')}" />${['#FF6B9D', '#9B59B6', '#00B4D8', '#2ECC71', '#F39C12', '#E74C3C', '#34495E'].map(c => `<button type="button" class="ed-swatch" style="background:${c}" onclick="document.querySelector('#edit-fields [data-k=${f.k}]').value='${c}'"></button>`).join('')}</div>`;
    const label = f.type === 'toggle' ? '' : `<div class="ed-label">${f.label}</div>`;
    return `<div class="ed-field">${label}${input}</div>`;
  }).join('');
  document.getElementById('edit-fields').innerHTML = html;
}

function readEditorFields() {
  const o = editorState.obj;
  document.querySelectorAll('#edit-fields [data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.dataset.type === 'days') o[k] = Array.from(el.querySelectorAll('input:checked')).map(x => x.value);
    else if (el.dataset.type === 'toggle') o[k] = el.checked;
    else if (el.type === 'number') o[k] = el.value === '' ? 0 : Number(el.value);
    else o[k] = el.value.trim();
  });
  return o;
}

function editorFieldChanged() { readEditorFields(); renderEditorFields(); }

function saveEditor() {
  const K = EDIT_KINDS[editorState.kind];
  const o = readEditorFields();
  const err = document.getElementById('edit-error');
  const missing = K.fields.find(f => f.required && !o[f.k]);
  if (missing) { err.textContent = 'חסר: ' + missing.label; return; }
  if (o.days !== undefined && Array.isArray(o.days) && !o.days.length) { err.textContent = 'בחרו לפחות יום אחד'; return; }
  K.save(o, editorState.isNew);
  saveState();
  closeEditor();
  renderAll();
  showToast('✓ נשמר');
}

function deleteFromEditor() {
  const K = EDIT_KINDS[editorState.kind];
  if (!confirm(K.confirmRemove || 'למחוק?')) return;
  K.remove(editorState.id);
  saveState();
  closeEditor();
  renderAll();
  showToast('נמחק');
}

function closeEditor() {
  document.getElementById('edit-modal').classList.remove('show');
  editorState = null;
}

  let v = raw;

    v = parseInt(raw, 10);
    if (isNaN(v) || v < 0) { renderSettingsTab(); return; }
  } else {
    v = String(raw).trim();
    if (!v) { renderSettingsTab(); return; }
  }
  const parts = path.split('.');
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
  const prevCurrency = currencyName();

// ---------- מיתוג: שם המטבע ושם המשפחה ----------
const BRAND_TOKEN = 'שמי׳ז';
function brandText(str) {
  const c = currencyName();
  return (!str || c === BRAND_TOKEN || str.indexOf(BRAND_TOKEN) === -1) ? str : str.split(BRAND_TOKEN).join(c);
}
function brandNode(root) {
  if (currencyName() === BRAND_TOKEN || !root) return;
  if (root.nodeType === 3) { if (root.nodeValue.indexOf(BRAND_TOKEN) !== -1) root.nodeValue = brandText(root.nodeValue); return; }
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) { if (n.nodeValue.indexOf(BRAND_TOKEN) !== -1) n.nodeValue = brandText(n.nodeValue); }
  [root].concat(Array.from(root.querySelectorAll('[placeholder],[title]'))).forEach(e => {
    ['placeholder', 'title'].forEach(a => { const v = e.getAttribute && e.getAttribute(a); if (v && v.indexOf(BRAND_TOKEN) !== -1) e.setAttribute(a, brandText(v)); });
  });
}
function applyBranding() {
  document.title = 'מערכת ' + currencyName() + ' 💰';
  brandNode(document.body);
}
['alert', 'confirm', 'prompt'].forEach(fn => {
  const orig = window[fn].bind(window);
  window[fn] = (msg, def) => orig(brandText(msg), def);
});
new MutationObserver(muts => {
  if (currencyName() === BRAND_TOKEN) return;
  muts.forEach(m => {
    if (m.type === 'characterData') brandNode(m.target);
    else m.addedNodes.forEach(brandNode);
  });
}).observe(document.body, { childList: true, subtree: true, characterData: true });

// ============================================================
// PARENT MODE (PIN)
// ============================================================
// הקוד נשמר (מוצפן) בנתונים המשותפים — אותו קוד בכל המכשירים.
// מצב הורה נשאר פתוח 5 דקות מהפעולה האחרונה בהגדרות, או עד לחיצה על 🔓.
const PARENT_UNLOCK_MS = 5 * 60 * 1000;
let parentUntil = 0;
let pinPending = null;
let pinMode = 'enter';

function pinHash(pin) { return 'h1:' + hashStr('shamiz-pin:' + pin) + hashStr(pin + ':shamiz'); }
function isParentUnlocked() { return Date.now() < parentUntil; }

function requireParent(action, reason) {
  if (isParentUnlocked()) {
    parentUntil = Date.now() + PARENT_UNLOCK_MS;
    updateLockBtn();
    action();
    return;
  }
  openPinModal(state.parentPinHash ? 'enter' : 'set', reason, action);
}

function openPinModal(mode, reason, action) {
  pinPending = action;
  pinMode = mode;
  document.getElementById('pin-title').textContent = pinMode === 'set' ? 'יצירת קוד הורה' : 'קוד הורה';
  document.getElementById('pin-sub').textContent = pinMode === 'set'
    ? (reason ? reason + ' — ' : '') + 'בחרו קוד של 4 ספרות. הוא ישמש בכל המכשירים.'
    : (reason ? reason + ' — ' : '') + 'הקלידו את קוד ההורה';
  const i1 = document.getElementById('pin-input'), i2 = document.getElementById('pin-input2');
  i1.value = ''; i2.value = '';
  i2.style.display = pinMode === 'set' ? 'block' : 'none';
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-modal').classList.add('show');
  setTimeout(() => i1.focus(), 50);
}

function submitPin() {
  const i1 = document.getElementById('pin-input'), i2 = document.getElementById('pin-input2');
  const err = document.getElementById('pin-error');
  const v1 = i1.value.trim(), v2 = i2.value.trim();
  if (!/^\d{4}$/.test(v1)) { err.textContent = 'הקוד צריך להיות 4 ספרות'; return; }
  if (pinMode === 'set') {
    if (v1 !== v2) { err.textContent = 'הקודים לא תואמים'; i2.value = ''; i2.focus(); return; }
    state.parentPinHash = pinHash(v1);
    saveState();
  } else if (pinHash(v1) !== state.parentPinHash) {
    err.textContent = 'קוד שגוי';
    i1.value = '';
    i1.focus();
    return;
  }
  parentUntil = Date.now() + PARENT_UNLOCK_MS;
  const act = pinPending;
  pinPending = null;
  document.getElementById('pin-modal').classList.remove('show');
  updateLockBtn();
  if (act) act();
}

function closePin() {
  pinPending = null;
  document.getElementById('pin-modal').classList.remove('show');
}

function lockParent() {
  parentUntil = 0;
  updateLockBtn();
  if (document.getElementById('page-settings').classList.contains('active')) showPage('today');
}

function toggleParentLock() {
  if (isParentUnlocked()) lockParent();
  else requireParent(() => {}, 'כניסה למצב הורה');
}

function updateLockBtn() {
  const b = document.getElementById('lock-btn');
  if (!b) return;
  const u = isParentUnlocked();
  b.textContent = u ? '🔓' : '🔒';
  b.title = u ? 'מצב הורה פתוח — לחצו לנעילה' : 'כניסה למצב הורה';
  b.classList.toggle('unlocked', u);
}

// ============================================================
// INIT
// ============================================================
function renderAll() {
  applyKidProfiles();
  if (!KIDS[selectedBonusKid]) selectedBonusKid = firstKid();
  if (!KIDS[selectedWalletKid]) selectedWalletKid = firstKid();
  if (!KIDS[selectedShopKid]) selectedShopKid = firstKid();
  renderToday();
  renderGraph();
  renderKidSelector('bonus-kid-selector', selectedBonusKid, 'selectBonusKid');
  renderBonusList();
  renderKidSelector('shop-kid-selector', selectedShopKid, 'selectShopKid');
  renderShop();
  renderKidSelector('wallet-kid-selector', selectedWalletKid, 'selectWalletKid');
  renderWallet();
  renderSettings();
  updateUndoBtn();
  updateLockBtn();
  applyBranding();
}

// Date display
function updateDate() {
  const now = new Date();
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  document.getElementById('date-display').textContent = `יום ${days[now.getDay()]}, ${now.toLocaleDateString('he-IL')}`;
}

let _renderedDay = todayKey();
updateDate();
setInterval(updateDate, 60000);
setInterval(() => {
  // אם האפליקציה נשארה פתוחה אחרי חצות — מרעננים ליום החדש
  if (todayKey() !== _renderedDay) { _renderedDay = todayKey(); renderAll(); return; }
  if (document.getElementById('page-today').classList.contains('active')) renderTodayHeader();
}, 30000);

// נעילה אוטומטית של מצב הורה
setInterval(() => { if (parentUntil && !isParentUnlocked()) lockParent(); }, 10000);
document.addEventListener('click', e => {
  if (isParentUnlocked() && e.target.closest && e.target.closest('#page-settings')) parentUntil = Date.now() + PARENT_UNLOCK_MS;
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('pin-modal').classList.contains('show')) submitPin();
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const ae = document.activeElement;
    if (SYNC.pendingRender && !(ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName))) refreshUI();
  }, 300);
});

// שכחתם את הקוד? פתחו את האתר עם ‎?resetpin‎ בסוף הכתובת
if (/[?&]resetpin\b/.test(location.search)) {
  if (confirm('לאפס את קוד ההורה? בכניסה הבאה להגדרות תתבקשו לבחור קוד חדש.')) {
    delete state.parentPinHash;
    saveState();
  }
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

// מציגים מיד את מה ששמור במכשיר, ואז מסנכרנים מול הענן ברקע
renderAll();
if (SCRIPT_URL) {
  pullNow(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullNow(); });
  window.addEventListener('focus', () => pullNow());
  window.addEventListener('online', () => { if (isDirty()) pushNow(); else pullNow(); });
  setInterval(() => { if (!document.hidden) pullNow(); }, 120000);
}
</script>
</body>
</html>
